pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'beacon-bounding-boxes'

include ':common'
include ':fabric'
include ':neoforge'

def runnerMatrix = [
    'fabric-26.1',
    'fabric-26.1.1',
    'fabric-26.1.2',
    'fabric-26.2',
    'fabric-26.3',
    'neoforge-26.1',
    'neoforge-26.1.1',
    'neoforge-26.1.2',
    'neoforge-26.2',
    'neoforge-26.3'
]

runnerMatrix.each { name ->
    def path = ":test-runners:${name}"
    include path
    project(path).projectDir = file("test-runners/${name}")
}
